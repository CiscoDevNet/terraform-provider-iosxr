---
name: GRPC
path: Cisco-IOS-XR-um-grpc-cfg:/grpc
doc_category: Management
default_delete_attributes: true
no_delete_attributes: true
test_tags: [GRPC]
attributes:
  - yang_name: port
    description: "Server listening port (1024-65535), default: 57400"
    exclude_test: true
    example: 57400
  - yang_name: vrf
    example: default
    exclude_test: true
  - yang_name: address-family/ADDRESS-FAMILY/IPV4/ipv4
    xpath: address-family/ipv4
    tf_name: address_family_ipv4
    delete_parent: true
    exclude_test: true
    example: true
  - yang_name: address-family/ADDRESS-FAMILY/IPV6/ipv6
    xpath: address-family/ipv6
    tf_name: address_family_ipv6
    delete_parent: true
    exclude_test: true
    example: true
  - yang_name: address-family/ADDRESS-FAMILY/DUAL/dual
    xpath: address-family/dual
    tf_name: address_family_dual
    delete_parent: true
    exclude_test: true
    example: true
  - yang_name: no-tls
    exclude_test: true
    example: true
  - yang_name: local-connection
    example: true
  - yang_name: certificate-authentication
    example: true
    exclude_test: true
  - yang_name: max-request-total
    minimum_test_value: 128
    example: 128
  - yang_name: max-request-per-user
    example: 10
  - yang_name: max-streams
    example: 32
  - yang_name: max-streams-per-user
    example: 32
  - yang_name: max-concurrent-streams
    example: 64
  - yang_name: memory/limit
    example: 1000
  - yang_name: dscp
    example: af11
  - yang_name: aaa/accounting/queue-size
    example: 100
  - yang_name: aaa/authorization/exec
    exclude_test: true
    example: default
  - yang_name: aaa/authentication/login
    exclude_test: true
    example: default
  - yang_name: name
    example: grpc-1
  - yang_name: keepalive/time
    example: 300
  - yang_name: keepalive/timeout
    example: 30
  - yang_name: min-keepalive-interval
    example: 300
  - yang_name: ttl
    example: 64
  - yang_name: tls-min-version
    example: "1.2"
  - yang_name: tls-max-version
    example: "1.3"
  - yang_name: tls-mutual
    exclude_test: true
    example: true
  - yang_name: tlsv1-disable
    exclude_test: true
    example: true
  - yang_name: tls-trustpoint
    exclude_test: true
    example: TRUSTPOINT-1
  - yang_name: tls-cipher/enable
    exclude_test: true
    example: ECDHE-RSA-AES128-GCM-SHA256
  - yang_name: tls-cipher/default
    example: enable
  - yang_name: tls-cipher/disable
    exclude_test: true
    example: ECDHE-RSA-AES256-GCM-SHA384
  - yang_name: certificate-id
    exclude_test: true
    example: CERT-1
  - yang_name: certificate/common-name
    exclude_test: true
    example: router.example.com
  - yang_name: listen-addresses/listen-addresses-argument
    tf_name: listen_addresses
    type: StringList
    exclude_test: true
    example: 192.0.2.1
  - yang_name: service-layer
    example: true
  - yang_name: service-layer/auto-register
    example: true
  - yang_name: segment-routing
    example: true
  - yang_name: segment-routing/traffic-eng
    example: true
  - yang_name: segment-routing/traffic-eng/policy-service
    example: true
  - yang_name: gribi
    example: true
  - yang_name: gribi/port
    example: 50051
  - yang_name: gnmi
    example: true
  - yang_name: gnmi/port
    example: 57401
  - yang_name: gnsi/service/certz/ssl-profile-id
    exclude_test: true
    example: SSL-PROFILE-1
