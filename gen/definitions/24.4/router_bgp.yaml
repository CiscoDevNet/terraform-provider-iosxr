---
name: Router BGP
path: Cisco-IOS-XR-um-router-bgp-cfg:/router/bgp/as[as-number=%s]
doc_category: BGP
attributes:
  - yang_name: as-number
    example: 65001
  - yang_name: default-metric
    example: 125
  - yang_name: mvpn
    example: true
  - yang_name: segment-routing/srv6/locator
    example: locator11
  - yang_name: segment-routing/srv6/usid/allocation/wide-local-id-block
    tf_name: segment_routing_srv6_usid_allocation_wide_local_id_block
    example: true
  - yang_name: graceful-maintenance/activate/all-neighbors
    example: true
  - yang_name: graceful-maintenance/activate/retain-routes
    example: true
  - yang_name: graceful-maintenance/activate/interfaces/interface
    tf_name: graceful_maintenance_activate_interfaces
    type: List
    attributes:
      - yang_name: interface-name
        id: true
        example: TenGigE0/0/0/2
  - yang_name: graceful-maintenance/activate/locations/location
    tf_name: graceful_maintenance_activate_locations
    type: List
    attributes:
      - yang_name: location-value
        id: true
        example: 0/RP0/CPU0
  - yang_name: mpls/activate/interfaces/interface
    tf_name: mpls_activate_interfaces
    type: List
    attributes:
      - yang_name: interface-name
        id: true
        example: TenGigE0/0/0/2
  - yang_name: as-league/peers/peer
    tf_name: as_league_peers
    type: List
    attributes:
      - yang_name: peer-as-number
        id: true
        example: 65002
  - yang_name: attribute-filter/groups/group
    tf_name: attribute_filter_groups
    type: List
    attributes:
      - yang_name: group-name
        id: true
        example: GROUP1
      - yang_name: attributes/attribute-code-ranges/attribute-code-range
        tf_name: attribute_code_ranges
        type: List
        attributes:
          - yang_name: start
            id: true
            example: 4
          - yang_name: end
            id: true
            example: 8
          - yang_name: discard
            example: true
          - yang_name: treat-as-withdraw
            example: true
            exclude_test: true
      # Device bug: Converts attribute-code entries to attribute-code-range with only 'start' value.
      # Returns attribute_codes list without keys. DDTS to be filed.
      # - yang_name: attributes/attribute
      #   tf_name: attribute_codes
      #   type: List
      #   attributes:
      #     - yang_name: attribute-code
      #       id: true
      #       example: CLUSTER-LIST
      #     - yang_name: discard
      #       exclude_test: true
      #       example: true
      #     - yang_name: treat-as-withdraw
      #       example: true
  - yang_name: as-lists/as-list
    tf_name: as_lists
    type: List
    attributes:
      - yang_name: as-list-name
        tf_name: list_name
        id: true
        example: AS-LIST-1
      - yang_name: as-list-numbers/as-list-number
        tf_name: as_numbers
        type: List
        attributes:
          - yang_name: as-list-value
            tf_name: as_value
            id: true
            example: 65010
  # Device bug: Returns wrong IP address in YANG response (10.1.1.2 -> 0.0.0.16).
  # IP format sent, but converted to hex in CLI (10.1.1.2 -> 0a010102). DDTS to be filed.
  # - yang_name: adjacencies/ip-addresses/ip-address
  #   tf_name: adjacencies_ip_addresses
  #   type: List
  #   exclude_test: true
  #   attributes:
  #     - yang_name: address
  #       id: true
  #       example: 10.1.1.2
  #     - yang_name: peer-sets/peer-set
  #       tf_name: peer_sets
  #       type: List
  #       exclude_test: true
  #       attributes:
  #         - yang_name: peer-set-number
  #           id: true
  #           example: 1
  #     - yang_name: adjacency-sid/index
  #       tf_name: adjacency_sid_index
  #       example: 60
  - yang_name: default-information/originate
    example: true
  - yang_name: socket/receive-buffer-size/receive-buffer-size-number
    tf_name: socket_receive_buffer_size
    delete_parent: true
    example: 1024
  - yang_name: socket/receive-buffer-size/bgp-read-buffer-size-byte
    tf_name: socket_receive_buffer_size_read
    delete_parent: true
    example: 1024
  - yang_name: socket/send-buffer-size/send-buffer-size-number
    tf_name: socket_send_buffer_size
    delete_parent: true
    example: 4096
  - yang_name: socket/send-buffer-size/bgp-write-buffer-size-byte
    tf_name: socket_send_buffer_size_write
    delete_parent: true
    example: 4096
  - yang_name: nexthop/mpls/forwarding/ibgp
    example: true
  - yang_name: nexthop/validation/color-extcomm/sr-policy
    example: true
  - yang_name: nexthop/validation/color-extcomm/disable
    exclude_test: true
    example: true
  - yang_name: nexthop/resolution/allow-default
    example: true
  - yang_name: nexthop/srte-metric/disable
    exclude_test: true
    example: true
  - yang_name: slow-peer/SLOW-PEER/DYNAMIC/dynamic
    xpath: slow-peer/dynamic
    tf_name: slow_peer_dynamic
    example: true
  - yang_name: slow-peer/SLOW-PEER/DYNAMIC/dynamic/threshold
    xpath: slow-peer/dynamic/threshold
    tf_name: slow_peer_dynamic_threshold
    example: 260
  - yang_name: slow-peer/SLOW-PEER/DETECTION-DISABLE/detection-disable
    xpath: slow-peer/detection-disable
    tf_name: slow_peer_detection_disable
    exclude_test: true
    example: true
  - yang_name: bgp/redistribute-internal
    example: true
  - yang_name: bgp/router-id
    example: 22.22.22.22
  - yang_name: bgp/unsafe-ebgp-policy
    example: true
  - yang_name: bgp/scan-time
    example: 30
  - yang_name: bgp/read-only
    exclude_test: true
    example: true
  - yang_name: bgp/lpts-secure-binding
    example: true
  - yang_name: bgp/as-path-loopcheck
    example: true
  - yang_name: bgp/auto-policy-soft-reset/disable
    example: true
  - yang_name: bgp/bestpath/cost-community/ignore
    example: true
  - yang_name: bgp/bestpath/compare-routerid
    example: true
  - yang_name: bgp/bestpath/aigp/ignore
    example: true
  - yang_name: bgp/bestpath/igp-metric/ignore
    exclude_test: true
    example: true
  - yang_name: bgp/bestpath/igp-metric/sr-policy
    example: true
  - yang_name: bgp/bestpath/med/missing-as-worst
    example: true
  - yang_name: bgp/bestpath/med/always
    example: true
    exclude_test: true
  - yang_name: bgp/bestpath/as-path/ignore
    example: true
  - yang_name: bgp/bestpath/as-path/multipath-relax
    example: true
  - yang_name: bgp/bestpath/origin-as/use/validity
    example: true
  - yang_name: bgp/bestpath/origin-as/allow/invalid
    example: true
  - yang_name: bgp/bestpath/sr-policy/SR-POLICY/PREFER/prefer
    xpath: bgp/bestpath/sr-policy/prefer
    tf_name: bgp_bestpath_sr_policy_prefer
    example: true
  - yang_name: bgp/bestpath/sr-policy/SR-POLICY/FORCE/force
    xpath: bgp/bestpath/sr-policy/force
    tf_name: bgp_bestpath_sr_policy_force
    exclude_test: true
    example: true
  - yang_name: bgp/cluster-id/CLUSTER-ID/ROUTE-REFLECTOR-NUMBER/route-reflector-number
    xpath: bgp/cluster-id/route-reflector-number
    tf_name: bgp_cluster_id_32bit_format
    delete_parent: true
    example: 100010
  - yang_name: bgp/cluster-id/CLUSTER-ID/ROUTE-REFLECTOR-IP-ADDRESS/route-reflector-ip-address
    xpath: bgp/cluster-id/route-reflector-ip-address
    tf_name: bgp_cluster_id_ip_format
    delete_parent: true
    exclude_test: true
    example: "192.168.1.1"
  - yang_name: bgp/default/local-preference
    example: 200
  - yang_name: bgp/enforce-first-as/disable
    example: true
  - yang_name: bgp/fast-external-fallover/disable
    example: true
  - yang_name: bgp/log/neighbor/changes/detail
    example: true
  - yang_name: bgp/log/neighbor/changes/disable
    exclude_test: true
    example: true
  - yang_name: bgp/log/message/disable
    example: true
  - yang_name: bgp/log/memory-threshold/memory-warning-number
    tf_name: bgp_log_memory_threshold_warning
    optional: true
    delete_parent: true
    example: 80
  - yang_name: bgp/log/memory-threshold/memory-critical-number
    tf_name: bgp_log_memory_threshold_critical
    delete_parent: true
    example: 90
  - yang_name: bgp/log/total-paths/total-paths-number
    tf_name: bgp_log_total_paths
    delete_parent: true
    example: 10000
  - yang_name: bgp/log/total-paths/warn-threshold-value
    tf_name: bgp_log_total_paths_warn_threshold
    delete_parent: true
    example: 80
  - yang_name: bgp/multipath/use/cluster-list-length
    example: true
  - yang_name: bgp/multipath/as-path/ignore/onwards
    example: true
  - yang_name: bgp/confederation/identifier
    example: 65001
  - yang_name: bgp/confederation/peers
    tf_name: bgp_confederation_peers
    type: List
    attributes:
      - yang_name: peer-as-number
        id: true
        example: 65010
  - yang_name: bgp/graceful-restart/enable
    example: true
  - yang_name: bgp/graceful-restart/purge-time
    example: 120
  - yang_name: bgp/graceful-restart/restart-time
    example: 90
  - yang_name: bgp/graceful-restart/stalepath-time
    example: 120
  - yang_name: bgp/graceful-restart/graceful-reset
    example: true
  - yang_name: bgp/graceful-restart/retain-nbr-routes/disable
    example: true
  - yang_name: bgp/install/diversion
    example: true
  - yang_name: bgp/update-delay/delay
    tf_name: bgp_update_delay
    optional: true
    delete_parent: true
    example: 240
  - yang_name: bgp/update-delay/always
    delete_parent: true
    example: true
  - yang_name: bgp/maximum/neighbor
    example: 5000
  - yang_name: bgp/origin-as/validation/signal/ibgp
    example: true
  - yang_name: bgp/origin-as/validation/time/TIME/OFF/off
    xpath: bgp/origin-as/validation/time/off
    tf_name: bgp_origin_as_validation_time_off
    delete_parent: true
    exclude_test: true
    example: true
  - yang_name: bgp/origin-as/validation/time/TIME/PREFIX-VALIDATION-TIME/prefix-validation-time
    xpath: bgp/origin-as/validation/time/prefix-validation-time
    tf_name: bgp_origin_as_validation_time
    delete_parent: true
    example: 45
  - yang_name: timers/bgp/keepalive-interval
    example: 10
  - yang_name: timers/bgp/KEEPALIVE-INTERVAL/ZERO/zero
    xpath: timers/bgp/zero
    tf_name: timers_bgp_holddown_zero
    exclude_test: true
    example: true
  - yang_name: timers/bgp/KEEPALIVE-INTERVAL/ZERO/zero/KEEPALIVE-OPTIONS/ZERO/zero
    xpath: timers/bgp/zero/zero
    tf_name: timers_bgp_holddown_zero_minimum_acceptable_zero
    delete_parent: true
    exclude_test: true
    example: true
  - yang_name: timers/bgp/KEEPALIVE-INTERVAL/ZERO/zero/KEEPALIVE-OPTIONS/MINIMUM-ACCEPTABLE-HOLDTIME/minimum-acceptable-holdtime
    xpath: timers/bgp/zero/minimum-acceptable-holdtime
    tf_name: timers_bgp_holddown_zero_minimum_acceptable_holdtime
    delete_parent: true
    exclude_test: true
    example: 30
  - yang_name: timers/bgp/KEEPALIVE-INTERVAL/HOLDTIME/holdtime/holdtime-number
    xpath: timers/bgp/holdtime/holdtime-number
    tf_name: timers_bgp_holdtime
    delete_parent: true
    example: 30
  - yang_name: timers/bgp/KEEPALIVE-INTERVAL/HOLDTIME/holdtime/KEEPALIVE-OPTIONS/MINIMUM-ACCEPTABLE-HOLDTIME/minimum-acceptable-holdtime
    xpath: timers/bgp/holdtime/minimum-acceptable-holdtime
    tf_name: timers_bgp_holdtime_minimum_acceptable_holdtime
    delete_parent: true
    example: 30
  - yang_name: nsr
    example: true
  - yang_name: nsr/disable
    delete_parent: true
    exclude_test: true
    example: true
  - yang_name: ibgp/policy/out/enforce-modifications
    example: true
  - yang_name: openconfig/rib-telemetry
    example: true
  - yang_name: update/limit
    example: 20
  - yang_name: update/in/error-handling/basic/ebgp/disable
    example: true
  - yang_name: update/in/error-handling/basic/ibgp/disable
    example: true
  - yang_name: update/in/error-handling/extended/ebgp
    example: true
  - yang_name: update/in/error-handling/extended/ibgp
    example: true
  - yang_name: update/out/logging
    example: true
  - yang_name: bfd/multiplier
    example: 4
  - yang_name: bfd/minimum-interval
    example: 10
  - yang_name: rpki/routes/route
    tf_name: rpki_routes
    type: List
    attributes:
      - yang_name: route-address
        id: true
        example: 172.16.1.0
      - yang_name: route-prefix
        id: true
        example: 24
      - yang_name: max
        tf_name: max_length
        id: true
        example: 24
      - yang_name: origin
        tf_name: origin_as
        id: true
        example: 501
  - yang_name: rpki/servers/server
    tf_name: rpki_servers
    type: List
    attributes:
      - yang_name: server-name
        tf_name: server
        id: true
        example: 192.168.1.200
      - yang_name: refresh-time/REFRESH-TIME/REFRESH-TIME-SECONDS/refresh-time-seconds
        xpath: refresh-time/refresh-time-seconds
        tf_name: refresh_time_seconds
        example: 120
      - yang_name: refresh-time/REFRESH-TIME/OFF/off
        xpath: refresh-time/off
        tf_name: refresh_time_off
        delete_parent: true
        exclude_test: true
        example: true
      - yang_name: response-time/RESPONSE-TIME/RESPONSE-TIME-SECONDS/response-time-seconds
        xpath: response-time/response-time-seconds
        tf_name: response_time_seconds
        example: 240
      - yang_name: response-time/RESPONSE-TIME/OFF/off
        xpath: response-time/off
        tf_name: response_time_off
        delete_parent: true
        exclude_test: true
        example: true
      - yang_name: purge-time
        example: 180
      - yang_name: username
        example: rpki-user
      - yang_name: password
        sensitive: true
        write_only: true
        example: 060506324F41
      - yang_name: transport/TRANSPORT/TCP/tcp/port
        xpath: transport/tcp/port
        tf_name: transport_tcp_port
        optional: true
        delete_parent: true
        example: 3323
      - yang_name: transport/TRANSPORT/SSH/ssh/port
        xpath: transport/ssh/port
        tf_name: transport_ssh_port
        delete_parent: true
        exclude_test: true
        example: 3323
      - yang_name: bind-source/interface
        example: Loopback0
      - yang_name: shutdown
        example: false

test_prerequisites:
  - path: Cisco-IOS-XR-um-router-bgp-cfg:/router/bgp/as[as-number=65001]
    attributes:
      - name: as-number
        value: 65001
    lists:
      - name: neighbor-groups/neighbor-group
        key: neighbor-group-name
        items:
          - attributes:
              - name: neighbor-group-name
                value: GROUP1
              - name: remote-as
                value: 65002
      - name: session-groups/session-group
        key: session-group-name
        items:
          - attributes:
              - name: session-group-name
                value: SGROUP1
      - name: address-families/address-family
        key: af-name
        items:
          - attributes:
              - name: af-name
                value: ipv4-unicast
  - path: Cisco-IOS-XR-um-router-bgp-cfg:/bmp/servers
    lists:
      - name: server
        key: server-number
        items:
          - attributes:
              - name: server-number
                value: 1
              - name: host/host-name
                value: 192.168.1.100
              - name: host/port
                value: 5000
