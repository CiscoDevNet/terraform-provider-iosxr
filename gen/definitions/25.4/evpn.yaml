---
name: EVPN
path: Cisco-IOS-XR-um-l2vpn-cfg:/evpn
doc_category: EVPN
attributes:
  # ===========================================================
  # REMOVALS — srv6 locators list replaced by a single locator container
  # ===========================================================
  - yang_name: segment-routing/srv6/locators/locator
    legacy: true
  # 25.4.2 device rejects Set on the global node (EDM 'not found'); CLI works.
  - yang_name: segment-routing/srv6/usid/allocation/wide-local-id-block
    exclude_test: true
  # ===========================================================
  # ADDITIONS — new in 25.4
  # ===========================================================
  - yang_name: segment-routing/srv6/locator/locator-name
    tf_name: srv6_locator_name
    example: LOC1
  - yang_name: segment-routing/srv6/locator/usid/allocation/wide-local-id-block
    tf_name: srv6_locator_usid_allocation_wide_local_id_block
    example: true
  - yang_name: virtual/interface/interface
    tf_name: virtual_interfaces
    type: List
    test_tags: [C8000]
    attributes:
      - yang_name: interface-name
        id: true
        example: TenGigE0/0/0/1/0.100
      - yang_name: ethernet-segment/identifier/type/zero/esi
        tf_name: ethernet_segment_esi_zero
        optional: true
        delete_parent: true
        example: "01.01.01.01.01.01.01.01.02"
      - yang_name: ethernet-segment/service-carving/hrw
        tf_name: ethernet_segment_service_carving_hrw
        exclude_test: true
        example: true
      - yang_name: ethernet-segment/bgp/route-target
        tf_name: ethernet_segment_bgp_rt
        delete_parent: true
        example: "01:01:01:01:01:02"
      - yang_name: ethernet-segment/convergence/reroute
        tf_name: ethernet_segment_convergence_reroute
        exclude_test: true
        example: true
      - yang_name: ethernet-segment/convergence/mac-mobility
        tf_name: ethernet_segment_convergence_mac_mobility
        exclude_test: true
        example: true
      - yang_name: ethernet-segment/convergence/nexthop-tracking
        tf_name: ethernet_segment_convergence_nexthop_tracking
        exclude_test: true
        example: true

test_prerequisites:
  - path: Cisco-IOS-XR-um-l2vpn-cfg:/evpn
