        example: 5
      - yang_name: police/exceed-action/set/ipencap-cos
        tf_name: police_exceed_action_set_ipencap_cos
        test_tags: [C8000]
        exclude_test: true
        example: 5
      - yang_name: police/violate-action/set/ipencap-cos
        tf_name: police_violate_action_set_ipencap_cos
        test_tags: [C8000]
