---
name: Router BGP
path: Cisco-IOS-XR-um-router-bgp-cfg:/router/bgp/as[as-number=%s]
doc_category: BGP
attributes:
  # ===========================================================
  # ADDITIONS — new in 25.4
  # ===========================================================
  - yang_name: bandwidth-groups/bandwidth-group
    tf_name: bandwidth_groups
    type: List
    attributes:
      - yang_name: bandwidth-group-name
        id: true
        example: BWG1
      - yang_name: bandwidth-ids/bandwidth-id
        tf_name: bandwidth_ids
        type: List
        attributes:
          - yang_name: bandwidth-id-number
            id: true
            example: 1
          - yang_name: value
            example: 1000
          - yang_name: bandwidth-unit
            example: gbps
          - yang_name: asn
            example: 65001
  - yang_name: bgp/neighbor-down/fast-hold-timer
    example: 500
  - yang_name: distance/bgp/external
    example: 100
  - yang_name: distance/bgp/internal
    example: 150
  - yang_name: distance/bgp/local
    example: 200

test_prerequisites:
  - path: Cisco-IOS-XR-um-router-bgp-cfg:/router/bgp/as[as-number=65001]
    attributes:
      - name: as-number
        value: 65001
    lists:
      - name: neighbor-groups/neighbor-group
        key: neighbor-group-name
        items:
          - attributes:
              - name: neighbor-group-name
                value: GROUP1
              - name: remote-as
                value: 65002
      - name: session-groups/session-group
        key: session-group-name
        items:
          - attributes:
              - name: session-group-name
                value: SGROUP1
      - name: address-families/address-family
        key: af-name
        items:
          - attributes:
              - name: af-name
                value: ipv4-unicast
  - path: Cisco-IOS-XR-um-router-bgp-cfg:/bmp/servers
    lists:
      - name: server
        key: server-number
        items:
          - attributes:
              - name: server-number
                value: 1
              - name: host/host-name
                value: 192.168.1.100
              - name: host/port
                value: 5000
