---
name: Router BGP VRF
path: Cisco-IOS-XR-um-router-bgp-cfg:/router/bgp/as[as-number=%s]/vrfs/vrf[vrf-name=%s]
doc_category: BGP
attributes:
  # ===========================================================
  # ADDITIONS — new in 25.4
  # ===========================================================
  - yang_name: distance/bgp/external
    example: 100
  - yang_name: distance/bgp/internal
    example: 150
  - yang_name: distance/bgp/local
    example: 200

test_prerequisites:
  - path: Cisco-IOS-XR-um-router-bgp-cfg:/router/bgp/as[as-number=65001]
    attributes:
      - name: as-number
        value: 65001
      - name: bgp/router-id
        value: 22.22.22.22
  - path: Cisco-IOS-XR-um-router-bgp-cfg:/bmp/servers
    lists:
      - name: server
        key: server-number
        items:
          - attributes:
              - name: server-number
                value: 1
              - name: host/host-name
                value: 192.168.1.100
              - name: host/port
                value: 5000
