---
name: Router BGP VRF Neighbor Address Family
path: Cisco-IOS-XR-um-router-bgp-cfg:/router/bgp/as[as-number=%s]/vrfs/vrf[vrf-name=%s]/neighbors/neighbor[address=%s]/address-families/address-family[af-name=%s]
doc_category: BGP
attributes:
  # ===========================================================
  # ADDITIONS — new in 25.4
  # ===========================================================
  - yang_name: default-policy-action/in
    example: accept
  - yang_name: default-policy-action/out
    example: accept
  - yang_name: bandwidth-grp/outbound/OUTBOUND/BANDWIDTH-GROUP-NAME/bandwidth-group-name
    xpath: bandwidth-grp/outbound/bandwidth-group-name
    tf_name: bandwidth_grp_outbound_name
    delete_parent: true
    exclude_test: true
    example: BWG1
  - yang_name: bandwidth-grp/outbound/OUTBOUND/INHERITANCE-DISABLE/inheritance-disable
    xpath: bandwidth-grp/outbound/inheritance-disable
    tf_name: bandwidth_grp_outbound_inheritance_disable
    delete_parent: true
    exclude_test: true
    example: true
  - yang_name: bandwidth-grp/inbound/INBOUND/BANDWIDTH-GROUP-NAME/bandwidth-group-name
    xpath: bandwidth-grp/inbound/bandwidth-group-name
    tf_name: bandwidth_grp_inbound_name
    delete_parent: true
    exclude_test: true
    example: BWG1
  - yang_name: bandwidth-grp/inbound/INBOUND/INHERITANCE-DISABLE/inheritance-disable
    xpath: bandwidth-grp/inbound/inheritance-disable
    tf_name: bandwidth_grp_inbound_inheritance_disable
    delete_parent: true
    exclude_test: true
    example: true
  - yang_name: fast-reroute/per-link/multipath-backup/address/ADDRESS/IP-ADDRESS/ip-address
    xpath: fast-reroute/per-link/multipath-backup/address/ip-address
    tf_name: fast_reroute_per_link_multipath_backup_address
    delete_parent: true
    exclude_test: true
    example: 192.168.1.1
  - yang_name: fast-reroute/per-link/multipath-backup/address/ADDRESS/INHERITANCE-DISABLE/inheritance-disable
    xpath: fast-reroute/per-link/multipath-backup/address/inheritance-disable
    tf_name: fast_reroute_per_link_multipath_backup_address_inheritance_disable
    delete_parent: true
    exclude_test: true
    example: true

test_prerequisites:
  - path: Cisco-IOS-XR-um-vrf-cfg:/vrfs/vrf[vrf-name=VRF2]
    attributes:
      - name: vrf-name
        value: VRF2
  - path: Cisco-IOS-XR-um-vrf-cfg:/vrfs/vrf[vrf-name=VRF2]/Cisco-IOS-XR-um-router-bgp-cfg:rd/Cisco-IOS-XR-um-router-bgp-cfg:two-byte-as
    attributes:
      - name: two-byte-as-number
        value: 65001
      - name: asn2-index
        value: 2
    dependencies: [0]
  - path: Cisco-IOS-XR-um-router-bgp-cfg:/router/bgp/as[as-number=65001]
    attributes:
      - name: as-number
        value: 65001
      - name: bgp/router-id
        value: 22.22.22.22
    lists:
      - name: address-families/address-family
        key: af-name
        items:
          - attributes:
              - name: af-name
                value: vpnv4-unicast
    dependencies: [1]
  - path: Cisco-IOS-XR-um-router-bgp-cfg:/router/bgp/as[as-number=65001]
    attributes:
      - name: as-number
        value: 65001
    lists:
      - name: address-families/address-family
        key: af-name
        items:
          - attributes:
              - name: af-name
                value: vpnv6-unicast
    dependencies: [1]
  - path: Cisco-IOS-XR-um-router-bgp-cfg:/router/bgp/as[as-number=65001]/vrfs/vrf[vrf-name=VRF2]
    no_delete: true
    attributes:
      - name: vrf-name
        value: VRF2
    lists:
      - name: address-families/address-family
        key: af-name
        items:
          - attributes:
              - name: af-name
                value: ipv4-unicast
      - name: neighbors/neighbor
        key: address
        items:
          - attributes:
              - name: address
                value: 10.1.1.2
              - name: remote-as
                value: 65002
    dependencies: [2]
  - path: Cisco-IOS-XR-um-route-policy-cfg:/routing-policy/route-policies/route-policy[route-policy-name=ROUTE_POLICY_1]
    attributes:
      - name: route-policy-name
        value: ROUTE_POLICY_1
      - name: rpl-route-policy
        value: "route-policy ROUTE_POLICY_1\\n  pass\\nend-policy\\n"
