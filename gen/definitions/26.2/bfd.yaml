---
name: BFD
path: Cisco-IOS-XR-um-bfd-sbfd-cfg:/bfd
doc_category: System
attributes:
  - yang_name: multipath/destinations/destination
    tf_name: multipath_destinations
    type: List
    attributes:
      # ===========================================================
      # ADDITIONS - new in 26.2
      # ===========================================================
      - yang_name: vrfs/vrf
        tf_name: vrfs
        type: List
        attributes:
          - yang_name: vrf-name
            id: true
            example: VRF1
          - yang_name: location-id
            example: 0/0/CPU0
