---
name: Segment Routing V6
path: Cisco-IOS-XR-segment-routing-ms-cfg:/sr/Cisco-IOS-XR-segment-routing-srv6-cfg:srv6
doc_category: Segment Routing
attributes:
  # ===========================================================
  # encapsulation/source-address: leaf -> container
  # 25.4: encapsulation/source-address (ip-address leaf)
  # 26.2: encapsulation/source-address/{option,address}
  #        address is only valid when option = explicit-address
  # ===========================================================
  - yang_name: encapsulation/source-address
    legacy: true
  - yang_name: encapsulation/source-address/option
    tf_name: encapsulation_source_address_option
    example: explicit-address
  - yang_name: encapsulation/source-address/address
    tf_name: encapsulation_source_address_address
    example: fccc:0:214::1
